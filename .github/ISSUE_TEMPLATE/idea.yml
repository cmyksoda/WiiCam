name: Suggest an idea
description: Something you'd love WiiCam to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like WiiCam to do?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: What would it help with?
      description: How you'd use it, or what it would make easier.
